<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
  </defs>

  <!-- Full-bleed dark slate transit background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Perimeter road frame -->
  <rect x="44" y="44" width="424" height="424" rx="84" fill="none" stroke="#334155" stroke-width="12" stroke-dasharray="28 18" />

  <!-- 3D Coach Bus Shadow -->
  <rect x="136" y="108" width="240" height="316" rx="48" fill="#000000" opacity="0.45" />

  <!-- Tires (Left & Right Axles) -->
  <rect x="116" y="146" width="24" height="56" rx="8" fill="#090D16" stroke="#475569" stroke-width="4" />
  <rect x="372" y="146" width="24" height="56" rx="8" fill="#090D16" stroke="#475569" stroke-width="4" />
  <rect x="116" y="308" width="24" height="56" rx="8" fill="#090D16" stroke="#475569" stroke-width="4" />
  <rect x="372" y="308" width="24" height="56" rx="8" fill="#090D16" stroke="#475569" stroke-width="4" />

  <!-- Sculpted Bus Chassis -->
  <rect x="136" y="92" width="240" height="316" rx="48" fill="url(#busGrad)" stroke="#FEF08A" stroke-width="6" />

  <!-- Front Panoramic Windshield -->
  <rect x="164" y="114" width="184" height="46" rx="18" fill="url(#glassGrad)" stroke="#FFFFFF" stroke-width="3" />

  <!-- Open-Top Passenger Cabin Well -->
  <rect x="168" y="178" width="176" height="194" rx="22" fill="#451A03" stroke="#78350F" stroke-width="4" />

  <!-- 6 Seated Passengers (2x3 Grid) -->
  <circle cx="214" cy="216" r="22" fill="#FFFFFF" />
  <circle cx="298" cy="216" r="22" fill="#FFFFFF" />
  <circle cx="214" cy="275" r="22" fill="#FFFFFF" />
  <circle cx="298" cy="275" r="22" fill="#FFFFFF" />
  <circle cx="214" cy="334" r="22" fill="#FDE68A" opacity="0.35" />
  <circle cx="298" cy="334" r="22" fill="#FFFFFF" />

  <!-- Headlights -->
  <circle cx="176" cy="98" r="10" fill="#FEF9C3" />
  <circle cx="336" cy="98" r="10" fill="#FEF9C3" />
</svg>
